<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Credexa financial management platform.">
  <meta name="theme-color" content="#0b1f33">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Credexa">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Credexa</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, "Segoe UI", Tahoma, Arial, sans-serif;
    }

    html, body {
      margin: 0;
      height: 100%;
      background: #f5f8fc;
    }

    /* Splash screen follows the same calm, full-page pattern as Sijil. */
    #app-loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f5f8fc;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      opacity: 1;
      transition: opacity .55s ease, visibility .55s ease;
    }

    #app-loading.is-hidden {
      opacity: 0;
      visibility: hidden;
    }

    .logo-wrap {
      position: relative;
      width: 112px;
      height: 112px;
      opacity: 0;
      transform: scale(.7);
      animation: pop .7s cubic-bezier(.2, .8, .2, 1) .1s forwards;
    }

    .logo-wrap img {
      position: relative;
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 28px;
      object-fit: cover;
      box-shadow: 0 14px 34px rgba(12, 86, 142, .28);
      animation: float 2.6s ease-in-out .9s infinite;
    }

    .logo-wrap::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 2px solid #0c568e;
      border-radius: 32px;
      opacity: 0;
      animation: ring 2.2s ease-out 1s infinite;
    }

    .brand-name {
      margin-top: 28px;
      color: #10213a;
      font-size: 34px;
      font-weight: 700;
      letter-spacing: .2px;
      opacity: 0;
      transform: translateY(10px);
      animation: rise .6s ease .45s forwards;
    }

    .loading-message {
      margin-top: 8px;
      padding: 0 24px;
      color: #688096;
      font-size: 15px;
      text-align: center;
      opacity: 0;
      transform: translateY(10px);
      animation: rise .6s ease .65s forwards;
    }

    .loading-track {
      position: relative;
      width: 168px;
      height: 4px;
      margin-top: 40px;
      overflow: hidden;
      border-radius: 2px;
      background: #e2edf5;
      opacity: 0;
      animation: rise .5s ease .9s forwards;
    }

    .loading-track::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 42%;
      border-radius: 2px;
      background: #0c568e;
      animation: slide 1.25s ease-in-out infinite;
    }

    .loading-text {
      margin-top: 12px;
      color: #688096;
      font-size: 12.5px;
      opacity: 0;
      animation: rise .5s ease 1s forwards;
    }

    @keyframes pop { to { opacity: 1; transform: scale(1); } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes ring { 0% { opacity: .35; transform: scale(1); } 100% { opacity: 0; transform: scale(1.35); } }
    @keyframes rise { to { opacity: 1; transform: translateY(0); } }
    @keyframes slide { 0% { inset-inline-start: -45%; } 100% { inset-inline-start: 103%; } }

    @media (prefers-reduced-motion: reduce) {
      #app-loading *, #app-loading *::after, #app-loading *::before {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <div id="app-loading" role="status" aria-label="جارٍ التحميل">
    <div class="logo-wrap">
      <img src="icons/Icon-512.png" alt="Credixa" />
    </div>
    <div class="brand-name" dir="ltr">Credixa</div>
    <div class="loading-message">إدارة الائتمان والخزينة والتسويات</div>
    <div class="loading-track" aria-hidden="true"></div>
    <div class="loading-text">جارٍ التحميل…</div>
  </div>

  <script>
    (function () {
      var splash = document.getElementById('app-loading');
      var start = Date.now();
      var minDuration = 1100;
      var done = false;

      function hideSplash() {
        if (done || !splash) return;
        done = true;
        var wait = Math.max(0, minDuration - (Date.now() - start));
        setTimeout(function () {
          splash.classList.add('is-hidden');
          setTimeout(function () { splash.remove(); }, 650);
        }, wait);
      }

      window.addEventListener('flutter-first-frame', hideSplash);
      setTimeout(hideSplash, 20000);
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
